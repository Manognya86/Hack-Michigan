<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GridWatch AI – Utility Pole Risk Profiling</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">⚡</div>
                <div>
                    <div class="logo-title">GRIDWATCH AI</div>
                    <div class="logo-sub">DTE ENERGY · POLE RISK PROFILING</div>
                </div>
            </div>
            <div class="weather-badge" id="weatherBadge">Loading weather...</div>
            <div class="header-actions">
                <button id="refreshBtn" class="btn-secondary">↻ REFRESH</button>
                <div class="watson-badge">watsonx.ai</div>
            </div>
        </div>
        <div class="stats-bar" id="statsBar"></div>
        <div id="savingsDisplay" class="stats-bar" style="background:#0F2A1F; justify-content:center;"></div>
        <div id="stormBanner" class="storm-banner" style="display: none;"></div>
        <div class="main-layout">
            <div class="pole-list">
                <div class="filter-row">
                    <select id="filterRisk" class="risk-filter">
                        <option value="all">ALL POLES</option>
                        <option value="critical">CRITICAL</option>
                        <option value="high">HIGH</option>
                        <option value="medium">MEDIUM</option>
                        <option value="low">LOW</option>
                    </select>
                </div>
                <div id="poleListContainer" class="pole-items"></div>
            </div>
            <div class="center-panel">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="map">MAP VIEW</button>
                    <button class="tab-btn" data-tab="detail">POLE DETAIL</button>
                    <button class="tab-btn" data-tab="cv">CV INSPECTION</button>
                    <button class="tab-btn" data-tab="ai">AI REPORT</button>
                    <button class="tab-btn" data-tab="storm">STORM SIM</button>
                    <button class="tab-btn" data-tab="analytics">ANALYTICS</button>
                    <button class="tab-btn" data-tab="predict">CUSTOM PREDICT</button>
                    <button class="tab-btn" data-tab="priority">PRIORITY</button>
                </div>
                <div class="tab-content">
                    <div id="mapView" class="tab-pane active"><div id="map" style="height: 100%; width: 100%;"></div></div>
                    <div id="detailView" class="tab-pane"></div>
                    <div id="cvView" class="tab-pane"></div>
                    <div id="aiView" class="tab-pane"></div>
                    <div id="stormView" class="tab-pane"></div>
                    <div id="analyticsView" class="tab-pane"></div>
                    <div id="predictView" class="tab-pane"></div>
                    <div id="priorityView" class="tab-pane"></div>
                </div>
            </div>
            <div class="right-panel" id="rightPanel"></div>
        </div>
    </div>
    <!-- 3D Modal -->
    <div id="threeDModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:10000;">
        <div style="position:relative; width:80%; height:80%; margin:5% auto; background:#0A1520; border-radius:12px; border:1px solid #1D9E75;">
            <button id="close3DBtn" style="position:absolute; top:10px; right:20px; background:#E24B4A; border:none; color:white; padding:5px 10px; border-radius:4px; cursor:pointer; font-weight:bold;">X</button>
            <canvas id="threeCanvas" style="width:100%; height:100%;"></canvas>
            <div style="position:absolute; bottom:10px; left:10px; color:#5DCAA5; font-size:10px; background:#0A1520AA; padding:4px 8px; border-radius:4px;">Damage: <span id="damageText">None</span></div>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
