<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>GridWatch AI | DTE Energy Pole Risk Profiling</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'IBM Plex Mono', monospace; background: #0A1520; color: #e0e0e0; }
        .app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        /* Header */
        .header { background: #0F1923; border-bottom: 2px solid #1D9E75; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 16px; }
        .logo-icon { width: 36px; height: 36px; background: #1D9E75; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; color: #0A1520; }
        .logo-text { font-weight: 600; font-size: 15px; letter-spacing: 0.02em; color: white; }
        .logo-sub { font-size: 10px; color: #1D9E75; letter-spacing: 0.12em; }
        .storm-toggle { background: #0F2A1F; border: 1px solid #1D9E75; border-radius: 4px; padding: 6px 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; color: #5DCAA5; font-size: 11px; font-weight: 600; }
        .storm-toggle.active { background: #501313; border-color: #E24B4A; color: #F09595; }
        .watsonx-badge { background: #0F2A1F; border: 1px solid #1D9E75; border-radius: 4px; padding: 6px 14px; font-size: 11px; letter-spacing: 0.08em; color: #5DCAA5; }
        /* Storm banner */
        .storm-banner { background: #501313; border-bottom: 1px solid #E24B4A; padding: 8px 24px; display: flex; align-items: center; gap: 16px; font-size: 12px; color: #F09595; }
        .storm-banner button { margin-left: auto; background: #791F1F; border: 1px solid #E24B4A; color: #F09595; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 11px; }
        /* Metrics bar */
        .metrics { background: #0F1923; border-bottom: 1px solid #1a2e3b; padding: 12px 24px; display: flex; gap: 32px; }
        .metric { display: flex; flex-direction: column; gap: 2px; }
        .metric-label { color: #4a6070; font-size: 9px; letter-spacing: 0.12em; }
        .metric-value { font-size: 18px; font-weight: 600; }
        /* Main layout */
        .main { display: flex; flex: 1; overflow: hidden; }
        /* Pole list sidebar */
        .pole-list { width: 260px; background: #0A1520; border-right: 1px solid #1a2e3b; display: flex; flex-direction: column; overflow-y: auto; }
        .filter-select { margin: 12px 16px; background: #0F1923; border: 1px solid #1a2e3b; color: #5DCAA5; padding: 6px 8px; border-radius: 4px; font-family: inherit; font-size: 11px; }
        .pole-item { padding: 12px 16px; border-bottom: 1px solid #1a2e3b; cursor: pointer; transition: background 0.1s; border-left: 2px solid transparent; }
        .pole-item.selected { background: #0F2A1F; border-left-color: #1D9E75; }
        .pole-id { font-size: 12px; font-weight: 500; color: #8aacb8; }
        .risk-badge { font-size: 9px; padding: 2px 7px; border-radius: 3px; font-weight: 600; }
        .risk-bar { flex: 1; height: 3px; background: #1a2e3b; border-radius: 2px; margin-top: 6px; }
        .risk-fill { height: 100%; border-radius: 2px; }
        /* Center panel */
        .center-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .tabs { background: #0A1520; border-bottom: 1px solid #1a2e3b; display: flex; padding: 0 16px; gap: 0; }
        .tab { background: transparent; border: none; border-bottom: 2px solid transparent; color: #4a6070; padding: 10px 16px; font-family: inherit; font-size: 10px; letter-spacing: 0.1em; cursor: pointer; }
        .tab.active { border-bottom-color: #1D9E75; color: #5DCAA5; }
        .tab-content { flex: 1; overflow-y: auto; padding: 20px; background: #0A1520; }
        /* Map container */
        #map { height: 100%; width: 100%; background: #0A1520; }
        /* Detail cards */
        .card { background: #0F1923; border: 1px solid #1a2e3b; border-radius: 6px; padding: 16px; margin-bottom: 16px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .cost-highlight { font-size: 22px; font-weight: 600; }
        .cv-preview { max-width: 100%; max-height: 240px; border-radius: 4px; }
        .upload-zone { border: 2px dashed #1a2e3b; border-radius: 6px; padding: 32px; text-align: center; cursor: pointer; }
        .ai-response { white-space: pre-wrap; font-size: 12px; line-height: 1.6; color: #8aacb8; }
        button { font-family: inherit; cursor: pointer; }
        .analytics-panel { width: 220px; background: #0A1520; border-left: 1px solid #1a2e3b; padding: 16px; overflow-y: auto; }
        .risk-dist-item { margin-bottom: 10px; }
        .risk-bar-sm { height: 3px; background: #1a2e3b; border-radius: 2px; margin-top: 4px; }
        .quick-action { background: #0F2A1F; border: 1px solid #1D9E75; color: #5DCAA5; padding: 8px; border-radius: 4px; width: 100%; margin-bottom: 8px; font-size: 9px; letter-spacing: 0.08em; }
        .quick-action.danger { background: #2A0F0F; border-color: #E24B4A; color: #F09595; }
    </style>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="logo">
            <div class="logo-icon">⚡</div>
            <div><div class="logo-text">GRIDWATCH AI</div><div class="logo-sub">DTE ENERGY · UTILITY POLE RISK PROFILING</div></div>
        </div>
        <div style="display: flex; gap: 12px;">
            <div id="stormToggleBtn" class="storm-toggle">🌩️ STORM MODE</div>
            <div class="watsonx-badge">POWERED BY watsonx.ai</div>
        </div>
    </div>
    <div id="stormBanner" class="storm-banner" style="display: none;">
        <span>⚠️ WIND ADVISORY — May 17–18 · 58mph winds · 2.3" rain</span>
        <button id="runStormAnalysisBtn">RUN STORM ANALYSIS ↗</button>
    </div>
    <div class="metrics" id="metricsBar"></div>
    <div class="main">
        <div class="pole-list" id="poleList"></div>
        <div class="center-panel">
            <div class="tabs">
                <button class="tab active" data-tab="map">MAP VIEW</button>
                <button class="tab" data-tab="detail">POLE DETAIL</button>
                <button class="tab" data-tab="cv">CV INSPECTION</button>
                <button class="tab" data-tab="report">AI REPORT</button>
            </div>
            <div class="tab-content" id="tabContent"></div>
        </div>
        <div class="analytics-panel" id="analyticsPanel"></div>
    </div>
</div>

<script>
    // ------------------- Global state -------------------
    let poles = [];
    let selectedPole = null;
    let stormMode = false;
    let map = null;
    let markers = {};
    let currentTab = 'map';

    // ------------------- Fetch data -------------------
    async function fetchPoles() {
        const res = await fetch('/api/poles');
        poles = await res.json();
        renderPoleList();
        renderMetrics();
        renderAnalytics();
        if (map) updateMap();
        if (currentTab === 'map') renderMapTab();
        if (selectedPole && currentTab === 'detail') renderDetailTab();
    }

    // ------------------- Render helpers -------------------
    function getRiskLevel(score) {
        if (score >= 70) return { label: 'Critical', color: '#E24B4A', bg: '#FCEBEB', textColor: '#A32D2D' };
        if (score >= 45) return { label: 'High', color: '#EF9F27', bg: '#FAEEDA', textColor: '#854F0B' };
        if (score >= 25) return { label: 'Medium', color: '#378ADD', bg: '#E6F1FB', textColor: '#185FA5' };
        return { label: 'Low', color: '#639922', bg: '#EAF3DE', textColor: '#3B6D11' };
    }

    function renderPoleList() {
        const container = document.getElementById('poleList');
        container.innerHTML = `<select id="riskFilter" class="filter-select"><option value="all">ALL POLES (${poles.length})</option><option value="critical">CRITICAL (${poles.filter(p=>p.riskScore>=70).length})</option><option value="high">HIGH (${poles.filter(p=>p.riskScore>=45 && p.riskScore<70).length})</option></select>`;
        const filterSelect = document.getElementById('riskFilter');
        const filtered = poles.filter(p => {
            if (filterSelect.value === 'all') return true;
            if (filterSelect.value === 'critical') return p.riskScore>=70;
            if (filterSelect.value === 'high') return p.riskScore>=45 && p.riskScore<70;
            return true;
        });
        filtered.sort((a,b)=>b.riskScore - a.riskScore).forEach(pole => {
            const risk = getRiskLevel(pole.riskScore);
            const div = document.createElement('div');
            div.className = `pole-item ${selectedPole?.id === pole.id ? 'selected' : ''}`;
            div.innerHTML = `
                <div style="display:flex; justify-content:space-between;"><span class="pole-id">${pole.id}</span><span class="risk-badge" style="background:${risk.bg};color:${risk.textColor}">${risk.label}</span></div>
                <div style="color:#4a6070; font-size:10px;">${pole.district}</div>
                <div class="risk-bar"><div class="risk-fill" style="width:${pole.riskScore}%; background:${risk.color}"></div></div>
            `;
            div.onclick = () => selectPole(pole);
            container.appendChild(div);
        });
    }

    function renderMetrics() {
        const critical = poles.filter(p=>p.riskScore>=70).length;
        const high = poles.filter(p=>p.riskScore>=45 && p.riskScore<70).length;
        const avgRisk = Math.round(poles.reduce((a,b)=>a+b.riskScore,0)/poles.length);
        const stormExposure = stormMode ? poles.filter(p=>p.riskScore>=60).length + ' AT RISK' : 'OFF';
        document.getElementById('metricsBar').innerHTML = `
            <div class="metric"><div class="metric-label">TOTAL POLES</div><div class="metric-value">${poles.length}</div></div>
            <div class="metric"><div class="metric-label">CRITICAL RISK</div><div class="metric-value" style="color:#E24B4A">${critical}</div></div>
            <div class="metric"><div class="metric-label">HIGH RISK</div><div class="metric-value" style="color:#EF9F27">${high}</div></div>
            <div class="metric"><div class="metric-label">AVG RISK SCORE</div><div class="metric-value">${avgRisk}/100</div></div>
            <div class="metric"><div class="metric-label">STORM EXPOSURE</div><div class="metric-value" style="color:${stormMode?'#E24B4A':'#4a6070'}">${stormExposure}</div></div>
        `;
    }

    function renderAnalytics() {
        const critical = poles.filter(p=>p.riskScore>=70).length;
        const high = poles.filter(p=>p.riskScore>=45 && p.riskScore<70).length;
        const medium = poles.filter(p=>p.riskScore>=25 && p.riskScore<45).length;
        const low = poles.filter(p=>p.riskScore<25).length;
        const wood = poles.filter(p=>p.material==='Wood').length;
        const steel = poles.filter(p=>p.material==='Steel').length;
        const composite = poles.filter(p=>p.material==='Composite').length;
        const totalReplaceCost = poles.reduce((a,b)=>a+b.replaceCost,0);
        const criticalReplaceCost = poles.filter(p=>p.riskScore>=70).reduce((a,b)=>a+b.replaceCost,0);
        document.getElementById('analyticsPanel').innerHTML = `
            <div style="color:#4a6070; font-size:9px; letter-spacing:0.12em; margin-bottom:12px;">RISK DISTRIBUTION</div>
            ${[['Critical', '#E24B4A', critical], ['High', '#EF9F27', high], ['Medium', '#378ADD', medium], ['Low', '#639922', low]].map(([label,color,count])=>`
                <div class="risk-dist-item"><div style="display:flex; justify-content:space-between;"><span style="font-size:10px;">${label}</span><span style="color:${color}">${count}</span></div><div class="risk-bar-sm"><div style="width:${(count/poles.length)*100}%; height:100%; background:${color}; border-radius:2px;"></div></div></div>
            `).join('')}
            <div style="border-top:1px solid #1a2e3b; margin:16px 0 12px 0;"></div>
            <div style="color:#4a6070; font-size:9px; letter-spacing:0.12em; margin-bottom:12px;">MATERIAL BREAKDOWN</div>
            ${[['Wood', wood], ['Steel', steel], ['Composite', composite]].map(([mat, cnt])=>`<div style="display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid #1a2e3b;"><span style="font-size:10px;">${mat}</span><span style="color:#8aacb8">${cnt} poles</span></div>`).join('')}
            <div style="border-top:1px solid #1a2e3b; margin:16px 0 12px 0;"></div>
            <div style="color:#4a6070; font-size:9px; letter-spacing:0.12em; margin-bottom:12px;">ESTIMATED COSTS</div>
            <div><div style="font-size:9px;">All Replacements</div><div style="color:#E24B4A; font-size:14px; font-weight:600;">$${(totalReplaceCost/1000).toFixed(0)}K</div></div>
            <div style="margin-top:8px;"><div style="font-size:9px;">Priority (Critical Only)</div><div style="color:#EF9F27; font-size:14px; font-weight:600;">$${(criticalReplaceCost/1000).toFixed(0)}K</div></div>
            <div style="border-top:1px solid #1a2e3b; margin:16px 0 12px 0;"></div>
            <button class="quick-action" id="fullTerritoryBtn">FULL TERRITORY REPORT ↗</button>
            <button class="quick-action danger" id="stormImpactBtn">STORM IMPACT ANALYSIS ↗</button>
        `;
        document.getElementById('fullTerritoryBtn')?.addEventListener('click', () => askWatsonx(`Generate a prioritized maintenance plan for ALL ${poles.length} poles in Metro Detroit DTE territory. Include top 5 most urgent, budget allocation, and expected risk reduction.`));
        document.getElementById('stormImpactBtn')?.addEventListener('click', () => { if(!stormMode) document.getElementById('stormToggleBtn').click(); runStormAnalysis(); });
    }

    async function askWatsonx(prompt) {
        const res = await fetch('/api/watsonx', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({prompt}) });
        const data = await res.json();
        setTab('report');
        document.getElementById('tabContent').innerHTML = `<div class="card"><div class="ai-response">${data.response || 'No response'}</div></div>`;
    }

    function selectPole(pole) {
        selectedPole = pole;
        renderPoleList();
        if (currentTab === 'detail') renderDetailTab();
        if (currentTab === 'report') renderReportTab();
    }

    function renderDetailTab() {
        if (!selectedPole) { document.getElementById('tabContent').innerHTML = '<div class="card">Select a pole from the list</div>'; return; }
        const risk = getRiskLevel(selectedPole.riskScore);
        document.getElementById('tabContent').innerHTML = `
            <div class="card"><div style="display:flex; justify-content:space-between;"><div><div style="font-size:18px; font-weight:600;">${selectedPole.id}</div><div style="font-size:11px; color:#4a6070;">${selectedPole.district} · Circuit ${selectedPole.circuit}</div></div><div style="text-align:right;"><div style="font-size:32px; font-weight:600; color:${risk.color}">${selectedPole.riskScore}</div><div style="font-size:10px;">RISK SCORE</div></div></div><div class="risk-bar" style="margin-top:12px;"><div class="risk-fill" style="width:${selectedPole.riskScore}%; background:${risk.color}"></div></div></div>
            <div class="grid-2"><div class="card"><div style="color:#4a6070; font-size:9px; letter-spacing:0.12em;">STRUCTURAL CONDITION</div>${[['Material',selectedPole.material],['Age',`${selectedPole.age} years`],['Tilt',`${selectedPole.tilt}°`],['Cracks',selectedPole.cracks?'DETECTED':'NONE'],['Rust',selectedPole.rust?'DETECTED':'NONE'],['Vegetation',selectedPole.vegetation.toUpperCase()]].map(([k,v])=>`<div style="display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid #1a2e3b;"><span style="font-size:11px;">${k}</span><span style="color:${v==='DETECTED'?'#E24B4A':v==='NONE'?'#639922':'#8aacb8'}">${v}</span></div>`).join('')}</div>
            <div class="card"><div style="color:#4a6070; font-size:9px; letter-spacing:0.12em;">ENVIRONMENT & RISK</div>${[['Storm Fail Prob',`${(selectedPole.stormFailProb*100).toFixed(0)}%`],['Remaining Life',`${selectedPole.remainingLife} yrs`],['Wind Exposure',selectedPole.windExposure.toUpperCase()],['Flood Zone',selectedPole.floodZone],['Soil Type',selectedPole.soilType],['Last Inspect',selectedPole.lastInspection]].map(([k,v])=>`<div style="display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid #1a2e3b;"><span style="font-size:11px;">${k}</span><span style="color:#8aacb8">${v}</span></div>`).join('')}</div></div>
            <div class="card"><div style="color:#4a6070; font-size:9px; letter-spacing:0.12em;">COST ESTIMATION (MICHIGAN)</div><div style="display:flex; gap:24px; margin-top:12px;"><div><div class="cost-highlight" style="color:#E24B4A">$${selectedPole.replaceCost.toLocaleString()}</div><div style="font-size:10px;">Full Replacement</div></div><div><div class="cost-highlight" style="color:#EF9F27">$${selectedPole.repairCost.toLocaleString()}</div><div style="font-size:10px;">Repair / Reinforce</div></div><div style="margin-left:auto; align-self:center;"><div style="background:#0F2A1F; border:1px solid ${risk.color}; border-radius:4px; padding:8px 16px; color:${risk.color}; font-size:11px; font-weight:600;">${selectedPole.riskScore>=70?'REPLACE RECOMMENDED':selectedPole.riskScore>=45?'REPAIR OR REPLACE':'MONITOR'}</div></div></div></div>
            <button id="askWatsonxBtn" style="width:100%; background:#0F2A1F; border:1px solid #1D9E75; color:#5DCAA5; padding:12px; border-radius:6px; margin-top:8px;">GENERATE WATSONX.AI MAINTENANCE RECOMMENDATION ↗</button>
        `;
        document.getElementById('askWatsonxBtn')?.addEventListener('click', () => askWatsonx(`Pole ${selectedPole.id}: risk ${selectedPole.riskScore}, tilt ${selectedPole.tilt}°, cracks ${selectedPole.cracks}, rust ${selectedPole.rust}, vegetation ${selectedPole.vegetation}, wind exposure ${selectedPole.windExposure}, flood zone ${selectedPole.floodZone}. Provide maintenance recommendation, urgency, cost estimate, and field crew notes.`));
    }

    function renderReportTab() {
        document.getElementById('tabContent').innerHTML = `<div class="card"><div class="ai-response">Select a pole or run storm analysis to see AI recommendations.</div></div>`;
    }

    // Map
    function initMap() {
        map = L.map('map').setView([42.3314, -83.0458], 9);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>' }).addTo(map);
    }
    function updateMap() {
        if (!map) return;
        for (let id in markers) map.removeLayer(markers[id]);
        markers = {};
        poles.forEach(pole => {
            const risk = getRiskLevel(pole.riskScore);
            const isStormRisk = stormMode && pole.riskScore >= 60;
            const icon = L.divIcon({ html: `<div style="background:${isStormRisk ? '#E24B4A' : risk.color}; width:12px; height:12px; border-radius:50%; border:2px solid white; box-shadow:0 0 4px rgba(0,0,0,0.5);"></div>`, iconSize: [12,12] });
            const marker = L.marker([pole.lat, pole.lng], { icon }).addTo(map);
            marker.bindPopup(`<b>${pole.id}</b><br>Risk: ${pole.riskScore}<br>${pole.district}`);
            markers[pole.id] = marker;
        });
    }

    // Storm mode
    async function toggleStormMode() {
        stormMode = !stormMode;
        const btn = document.getElementById('stormToggleBtn');
        const banner = document.getElementById('stormBanner');
        if (stormMode) {
            btn.classList.add('active');
            banner.style.display = 'flex';
            // Fetch real alerts
            const alerts = await fetch('/api/storm_alerts').then(r=>r.json());
            banner.querySelector('span').innerHTML = `⚠️ ${alerts.stormAlert} — ${alerts.stormDate} · ${alerts.windSpeed}mph winds · ${alerts.precipIn}" rain`;
        } else {
            btn.classList.remove('active');
            banner.style.display = 'none';
        }
        renderMetrics();
        updateMap();
    }
    async function runStormAnalysis() {
        const polesForSim = poles.map(p => ({ pole_id: p.id, lat: p.lat, lon: p.lng, age: p.age, material: p.material, current_risk_score: p.riskScore }));
        const res = await fetch('/api/predict_storm_impact', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ poles: polesForSim, use_forecast: true }) });
        const data = await res.json();
        let msg = `Storm scenario: ${data.storm_scenario}\nTotal estimated cost: $${data.total_estimated_cost}\nAffected poles:\n`;
        data.affected_poles.slice(0,5).forEach(p => { msg += `${p.pole_id}: damage ${p.predicted_damage_severity}%, cost $${p.estimated_repair_cost}\n`; });
        askWatsonx(`Storm impact analysis: ${msg}\nProvide crew deployment recommendation and priority list.`);
    }

    // CV upload
    function renderCVTab() {
        document.getElementById('tabContent').innerHTML = `
            <div class="card"><div style="color:#4a6070; font-size:9px; letter-spacing:0.12em;">COMPUTER VISION INSPECTION</div>
            <div id="cvUploadZone" class="upload-zone">📸 Click to upload pole image</div>
            <input type="file" id="cvFileInput" accept="image/*" style="display:none;">
            <div id="cvPreview"></div>
            <button id="cvAnalyzeBtn" style="margin-top:12px; width:100%; background:#0F2A1F; border:1px solid #1D9E75; color:#5DCAA5; padding:10px;">ANALYZE IMAGE ↗</button>
            <div id="cvResult"></div></div>
        `;
        const zone = document.getElementById('cvUploadZone');
        const fileInput = document.getElementById('cvFileInput');
        zone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => { document.getElementById('cvPreview').innerHTML = `<img src="${ev.target.result}" class="cv-preview">`; };
                reader.readAsDataURL(file);
                window.currentCvFile = file;
            }
        };
        document.getElementById('cvAnalyzeBtn').onclick = async () => {
            if (!window.currentCvFile) { alert('Select an image first'); return; }
            const formData = new FormData();
            formData.append('image', window.currentCvFile);
            formData.append('lat', poles[0]?.lat || 42.3314);
            formData.append('lon', poles[0]?.lng || -83.0458);
            formData.append('age', 20);
            const res = await fetch('/api/analyze', { method:'POST', body:formData });
            const data = await res.json();
            if (data.success) {
                document.getElementById('cvResult').innerHTML = `<div class="card"><pre style="font-size:12px;">Risk Score: ${data.risk_score}\nRisk Level: ${data.risk_level}\nTilt: ${data.features.tilt_angle.toFixed(1)}°\nCrack: ${(data.features.crack_score*100).toFixed(0)}%\nRust: ${(data.features.rust_percentage*100).toFixed(0)}%\nVegetation: ${(data.features.vegetation_proximity*100).toFixed(0)}%\nEst. Cost: $${data.estimated_repair_cost}\nRecommendation: ${data.recommendation}</pre></div>`;
            } else {
                document.getElementById('cvResult').innerHTML = `<div class="card" style="color:#E24B4A">Error: ${data.error}</div>`;
            }
        };
    }

    // Tab management
    function setTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
        if (tab === 'map') renderMapTab();
        else if (tab === 'detail') renderDetailTab();
        else if (tab === 'cv') renderCVTab();
        else if (tab === 'report') renderReportTab();
    }
    function renderMapTab() {
        if (!map) initMap();
        setTimeout(() => { map.invalidateSize(); updateMap(); }, 100);
        document.getElementById('tabContent').innerHTML = '<div id="map" style="height:100%;"></div>';
        if (map) map.remove();
        initMap();
        updateMap();
    }

    // Event listeners
    document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', (e) => setTab(e.target.dataset.tab)));
    document.getElementById('stormToggleBtn').addEventListener('click', toggleStormMode);
    document.getElementById('runStormAnalysisBtn')?.addEventListener('click', runStormAnalysis);

    // Initial load
    fetchPoles().then(() => setTab('map'));
</script>
</body>
</html>
