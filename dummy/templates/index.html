<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>GridWatch AI | DTE Energy Real‑Time Pole Risk</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'IBM Plex Mono', monospace; background: #0A1520; color: #e0e0e0; }
        .app { display: flex; flex-direction: column; height: 100vh; }
        .header { background: #0F1923; border-bottom: 2px solid #1D9E75; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
        .logo { display: flex; align-items: center; gap: 16px; }
        .logo-icon { width: 36px; height: 36px; background: #1D9E75; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; color: #0A1520; }
        .logo-text { font-weight: 600; font-size: 15px; color: white; }
        .logo-sub { font-size: 10px; color: #1D9E75; letter-spacing: 0.12em; }
        .storm-toggle { background: #0F2A1F; border: 1px solid #1D9E75; border-radius: 4px; padding: 6px 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; color: #5DCAA5; font-size: 11px; font-weight: 600; }
        .storm-toggle.active { background: #501313; border-color: #E24B4A; color: #F09595; }
        .main { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 260px; background: #0A1520; border-right: 1px solid #1a2e3b; overflow-y: auto; }
        .pole-item { padding: 12px 16px; border-bottom: 1px solid #1a2e3b; cursor: pointer; }
        .pole-item.selected { background: #0F2A1F; border-left: 2px solid #1D9E75; }
        .map-container { flex: 1; }
        #map { height: 100%; width: 100%; }
        .analytics { width: 240px; background: #0A1520; border-left: 1px solid #1a2e3b; padding: 16px; overflow-y: auto; }
        .risk-badge { font-size: 9px; padding: 2px 7px; border-radius: 3px; font-weight: 600; }
        button { background: #0F2A1F; border: 1px solid #1D9E75; color: #5DCAA5; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-family: inherit; }
        .loading { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:none; justify-content:center; align-items:center; z-index:9999; }
        .spinner { width:50px; height:50px; border:5px solid #1D9E75; border-top:5px solid #0A1520; border-radius:50%; animation:spin 1s linear infinite; }
        @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
    </style>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<div class="loading" id="loading"><div class="spinner"></div></div>
<div class="app">
    <div class="header">
        <div class="logo">
            <div class="logo-icon">⚡</div>
            <div><div class="logo-text">GRIDWATCH AI</div><div class="logo-sub">DTE ENERGY · REAL‑TIME POLE RISK</div></div>
        </div>
        <div id="stormToggleBtn" class="storm-toggle">🌩️ STORM MODE</div>
    </div>
    <div class="main">
        <div class="sidebar" id="poleList"></div>
        <div class="map-container">
            <div id="map"></div>
        </div>
        <div class="analytics" id="analyticsPanel"></div>
    </div>
</div>

<script>
    let map = null;
    let markers = {};
    let allPoles = [];
    let stormMode = false;

    async function fetchPoles() {
        const res = await fetch('/api/poles');
        allPoles = await res.json();
        renderPoleList();
        renderAnalytics();
        if (!map) initMap();
        updateMap();
    }

    function getRiskColor(score) {
        if (score >= 70) return '#E24B4A';
        if (score >= 45) return '#EF9F27';
        return '#639922';
    }

    function renderPoleList() {
        const container = document.getElementById('poleList');
        container.innerHTML = '<div style="padding:10px; text-align:center;">📌 REAL POLES FROM OSM</div>';
        allPoles.forEach(p => {
            const div = document.createElement('div');
            div.className = 'pole-item';
            div.innerHTML = `<div><b>${p.id}</b> <span class="risk-badge" style="background:${getRiskColor(p.riskScore)}; color:white">${p.riskScore}</span></div><div style="font-size:10px;">${p.lat.toFixed(4)}, ${p.lon.toFixed(4)}</div>`;
            div.onclick = () => {
                if (markers[p.id]) {
                    map.setView([p.lat, p.lon], 16);
                    markers[p.id].openPopup();
                }
            };
            container.appendChild(div);
        });
    }

    function renderAnalytics() {
        const critical = allPoles.filter(p=>p.riskScore>=70).length;
        const high = allPoles.filter(p=>p.riskScore>=45 && p.riskScore<70).length;
        const avg = Math.round(allPoles.reduce((a,b)=>a+b.riskScore,0)/allPoles.length);
        document.getElementById('analyticsPanel').innerHTML = `
            <div style="color:#4a6070; font-size:11px; margin-bottom:16px;">📊 REAL‑TIME STATS</div>
            <div>Total Poles: ${allPoles.length}</div>
            <div>Critical: ${critical} | High: ${high}</div>
            <div>Avg Risk: ${avg}</div>
            <button id="stormAnalyzeBtn" style="margin-top:20px;">⛈️ RUN STORM SIM</button>
            <button id="exportKmlBtn" style="margin-top:8px;">📡 EXPORT KML</button>
        `;
        document.getElementById('stormAnalyzeBtn')?.addEventListener('click', async () => {
            const polesForSim = allPoles.map(p => ({ pole_id: p.id, lat: p.lat, lon: p.lon, age: p.age, material: p.material, current_risk_score: p.riskScore }));
            const res = await fetch('/api/predict_storm_impact', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ poles: polesForSim, use_forecast: false, custom_wind: 60, custom_rain: 2 }) });
            const data = await res.json();
            alert(`Storm impact: $${data.total_estimated_cost} total repairs.\nCheck console for details.`);
        });
        document.getElementById('exportKmlBtn')?.addEventListener('click', async () => {
            const damage = allPoles.map(p => ({ pole_id: p.id, latitude: p.lat, longitude: p.lon, risk_score: p.riskScore, risk_level: p.risk_level, estimated_repair_cost: 5000 }));
            const res = await fetch('/api/generate_kml', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ damage_data: damage, storm_name: 'Live_Assessment' }) });
            const data = await res.json();
            window.open(data.kml_url, '_blank');
        });
    }

    function initMap() {
        map = L.map('map').setView([42.3314, -83.0458], 10);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; OSM' }).addTo(map);
        updateMap();
    }

    function updateMap() {
        if (!map) return;
        for (let id in markers) map.removeLayer(markers[id]);
        markers = {};
        allPoles.forEach(p => {
            const color = getRiskColor(p.riskScore);
            const isStormRisk = stormMode && p.riskScore >= 60;
            const circle = L.circleMarker([p.lat, p.lon], { radius: isStormRisk ? 12 : 8, color: isStormRisk ? '#E24B4A' : color, fillOpacity: 0.8, weight: 2, fillColor: isStormRisk ? '#E24B4A' : color }).addTo(map);
            circle.bindPopup(`<b>${p.id}</b><br>Risk: ${p.riskScore}<br>Tilt: ${p.tilt}°<br>Age: ${p.age} yrs`);
            markers[p.id] = circle;
        });
    }

    async function toggleStorm() {
        stormMode = !stormMode;
        const btn = document.getElementById('stormToggleBtn');
        if (stormMode) {
            btn.classList.add('active');
            const alerts = await fetch('/api/storm_alerts').then(r=>r.json());
            alert(`⚠️ STORM MODE ACTIVE\n${alerts.stormAlert}\nWinds: ${alerts.windSpeed} mph\nPrecip: ${alerts.precipIn} in`);
        } else {
            btn.classList.remove('active');
        }
        updateMap();
    }

    document.getElementById('stormToggleBtn').addEventListener('click', toggleStorm);
    fetchPoles();
    setInterval(fetchPoles, 60000); // refresh every minute
</script>
</body>
</html>
